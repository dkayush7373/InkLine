  <script>
    (function() {
      try {
        var raw = localStorage.getItem('inkline.prefs.v1');
        if (raw) {
          var prefs = JSON.parse(raw);
          if (prefs && (prefs.theme === 'light' || prefs.theme === 'dark')) {
            document.documentElement.setAttribute('data-theme', prefs.theme);
          }
        }
      } catch (e) {}
    })();
  </script>

  <link rel="stylesheet" href="style.css">
</head>

    <main class="tasks-container" style="display: flex; align-items: center; justify-content: center; padding: var(--space-8) var(--space-4); text-align: center;">
